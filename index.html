<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>gon · central</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet">
  <link id="dynamic-favicon" rel="icon" type="image/gif" href="">
  <style>
    :root {
      --bg: #050506;
      --card-bg: rgba(16, 16, 18, 0.75);
      --bd: rgba(255, 255, 255, 0.08);
      --bd-h: rgba(255, 255, 255, 0.18);
      --text: #ffffff;
      --muted: #666;
      --muted2: #888;
      --red: #e03030;
      --red-glow: rgba(224, 48, 48, 0.18);
      --purple: #8b5cf6;
      --purple-glow: rgba(139, 92, 246, 0.2);
      --online: #23a559;
      --idle: #f0b232;
      --dnd: #f23f43;
      --offline: #80848e;
      --card-w: clamp(130px, 18vw, 160px);
      --card-expanded: clamp(160px, 22vw, 200px);
      --radius: 22px;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      --rosecream: #f2c4b0;
      --rosecream-glow: rgba(242, 196, 176, 0.15);
    }

    link[rel="icon"] {
      border-radius: 50% !important
    }

    ::-webkit-scrollbar {
      display: none;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 60px;
      gap: 0;
      cursor: default;
      user-select: none;
    }

    #bg-img {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(.15) blur(40px) saturate(0.5);
      transform: scale(1.15);
      transition: opacity 1.2s var(--ease);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.018;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      z-index: 200;
      min-width: 0;
    }

    .nb-blur {
      position: absolute;
      inset: 0;
      backdrop-filter: blur(20px) saturate(1.5);
      background: rgba(5, 5, 6, 0.85);
    }

    .nb-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
    }

    .nb-inner {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 clamp(12px, 3vw, 28px);
      gap: 12px;
      min-width: 0;
    }

    .nb-left {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.5vw, 14px);
      flex-shrink: 1;
      min-width: 0;
      flex-wrap: nowrap;
    }

    .nb-logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: rgba(255, 255, 255, .92);
      text-transform: lowercase;
      letter-spacing: -.01em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nb-sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    .nb-sub {
      font-size: clamp(0.55rem, 1.2vw, 0.65rem);
      color: var(--muted2);
      font-family: 'Syne', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nb-cnl {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(224, 48, 48, 0.1);
      border: 1px solid rgba(224, 48, 48, 0.25);
      border-radius: 24px;
      padding: 5px 12px;
      text-decoration: none;
      transition: all 0.25s var(--ease);
      flex-shrink: 0;
      white-space: nowrap;
    }

    .nb-cnl:hover {
      background: rgba(224, 48, 48, 0.2);
      border-color: rgba(224, 48, 48, 0.5);
      transform: translateY(-1px);
    }

    .nb-cnl img {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .nb-cnl span {
      font-family: 'Syne', sans-serif;
      font-size: clamp(0.5rem, 1vw, 0.6rem);
      font-weight: 700;
      color: rgba(255, 255, 255, .88);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .audio-bar {
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 10px);
      flex-shrink: 0;
    }

    @media (max-width: 380px) {
      .nb-sub {
        display: none;
      }

      .nb-sep:nth-child(2) {
        display: none;
      }
    }

    @media (max-width: 340px) {
      .track-name {
        display: none;
      }
    }

    .track-name {
      font-size: clamp(0.5rem, 1vw, 0.6rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-play {
      background: none;
      border: none;
      color: rgba(255, 255, 255, .75);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      width: 20px;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-play:hover {
      color: #fff;
      transform: scale(1.05);
    }

    /* Remove o estilo genérico que conflita */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      border-radius: 4px;
      margin: 0;
    }

    /* Track comum (não usada diretamente, mas garante consistência) */
    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Thumbs */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      margin-top: -4px;
      /* centraliza verticalmente */
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
    }

    /* ===== Barra de Progresso (#seek) ===== */
    #seek {
      width: clamp(70px, 15vw, 120px);
      height: 4px;
    }

    #seek::-webkit-slider-runnable-track {
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      border-radius: 4px;
    }

    #seek::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -4px;
    }

    /* ===== Barra de Volume (#vl) ===== */
    #vl {
      width: clamp(45px, 8vw, 65px);
      height: 3px;
    }

    #vl::-webkit-slider-runnable-track {
      background: rgba(255, 255, 255, 0.12);
      height: 3px;
      border-radius: 3px;
    }

    #vl::-webkit-slider-thumb {
      width: 10px;
      height: 10px;
      margin-top: -3.5px;
    }

    /* ===== Responsivo ===== */
    @media (max-width: 480px) {
      .track-name {
        display: none;
        /* esconde nome da música em telas muito pequenas */
      }

      #seek {
        width: clamp(50px, 20vw, 80px);
      }

      #vl {
        width: clamp(35px, 10vw, 50px);
      }

      .btn-play {
        font-size: 0.7rem;
        width: 16px;
      }
    }

    .stage {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: clamp(12px, 2.5vw, 20px);
      flex-wrap: wrap;
      padding: 0 clamp(10px, 3vw, 30px);
      perspective: 1200px;
    }

    .card {
      position: relative;
      width: var(--card-w);
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform, width, border-color, box-shadow;
      transition:
        border-color 0.35s var(--ease),
        box-shadow 0.4s var(--ease),
        width 0.45s var(--ease-spring),
        transform 0.4s var(--ease);
      overflow: visible;
    }

    .card:hover {
      width: var(--card-expanded);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 25px 45px -12px rgba(0, 0, 0, 0.6),
        0 0 0 2px rgba(255, 255, 255, 0.02);
      z-index: 30;
      transform: translateY(-6px);
    }

    .card.card-center {
      border-color: rgba(139, 92, 246, 0.3);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.1);
    }

    .card.card-center:hover {
      border-color: rgba(139, 92, 246, 0.5);
      box-shadow:
        0 0 0 1px rgba(139, 92, 246, 0.1),
        0 25px 45px -12px rgba(0, 0, 0, 0.6),
        0 0 30px rgba(139, 92, 246, 0.2);
      transform: translateY(-6px);
    }

    .card[data-tag-color="purple"]:hover {
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), 0 25px 45px -12px rgba(0, 0, 0, 0.6);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .card[data-tag-color="red"]:hover {
      box-shadow: 0 0 20px rgba(224, 48, 48, 0.4), 0 25px 45px -12px rgba(0, 0, 0, 0.6);
      border-color: rgba(224, 48, 48, 0.5);
    }

    .card-inner {
      width: 100%;
      height: 100%;
      transition: transform 0.3s var(--ease);
    }

    .glare {
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.2) 0%, transparent 65%);
      transition: opacity 0.3s ease;
    }

    .ci {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(18px, 3vw, 24px) clamp(10px, 2vw, 16px) clamp(16px, 2.5vw, 20px);
      gap: 0;
    }

    .aw {
      position: relative;
      width: clamp(58px, 10vw, 75px);
      height: clamp(58px, 10vw, 75px);
      margin-bottom: clamp(10px, 1.8vw, 14px);
      flex-shrink: 0;
      transition: transform 0.4s var(--ease-spring);
    }

    .av-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      padding: 2px;
      background: rgba(255, 255, 255, 0.1);
    }

    .av {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--bd);
      background: #111;
      transition: all 0.3s;
    }

    .card:hover .av {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .av-wrapper::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
      background: conic-gradient(from 0deg, var(--glow-start), var(--glow-end), var(--glow-start));
      animation: spin-glow 1.5s linear infinite;
    }

    .av-wrapper[data-glow="purple"]::before {
      --glow-start: #8b5cf6;
      --glow-end: #c4b5fd;
    }

    .av-wrapper[data-glow="red"]::before {
      --glow-start: #e03030;
      --glow-end: #ff9999;
    }

    .aw:hover .av-wrapper::before {
      opacity: 1;
    }

    @keyframes spin-glow {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .card:hover .aw {
      transform: scale(1.05);
    }

    .sd {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: clamp(12px, 2.2vw, 14px);
      height: clamp(12px, 2.2vw, 14px);
      border-radius: 50%;
      border: 2px solid var(--bg);
      background: var(--offline);
      transition: all 0.3s;
      z-index: 3;
    }

    .sd.online {
      background: var(--online);
      box-shadow: 0 0 8px rgba(35, 165, 89, 0.6);
    }

    .sd.idle {
      background: var(--idle);
      box-shadow: 0 0 8px rgba(240, 178, 50, 0.5);
    }

    .sd.dnd {
      background: var(--dnd);
      box-shadow: 0 0 8px rgba(242, 63, 67, 0.5);
    }

    .sd.online::before,
    .sd.online::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(35, 165, 89, 0.5);
      pointer-events: none;
      opacity: 0;
    }

    .sd.online::before {
      animation: ping-wave 2.2s ease-out infinite;
    }

    .sd.online::after {
      animation: ping-wave 2.2s ease-out infinite;
      animation-delay: 0.8s;
    }

    @keyframes ping-wave {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }

      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    .nm {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      margin-bottom: 4px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-align: center;
      word-break: break-word;
      max-width: 100%;
      cursor: pointer;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .nm:hover {
      color: var(--online);
      text-shadow: 0 0 8px rgba(35, 165, 89, 0.5);
    }

    .un {
      font-size: clamp(0.6rem, 1.2vw, 0.7rem);
      color: var(--muted2);
      font-weight: 400;
      margin-bottom: 8px;
      text-align: center;
      word-break: break-word;
      max-width: 100%;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
      padding: 2px 6px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0);
    }

    .un:hover {
      color: var(--online);
      background: rgba(35, 165, 89, 0.15);
    }

    .owner-tag-link {
      text-decoration: none;
      margin-bottom: 8px;
      display: inline-block;
    }

    .owner-tag {
      display: inline-flex;
      align-items: center;
      background: var(--red-glow);
      border: 1px solid rgba(224, 48, 48, 0.35);
      padding: 3px 10px;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: clamp(0.45rem, 0.9vw, 0.52rem);
      font-weight: 700;
      color: #e05050;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      white-space: nowrap;
      cursor: pointer;
    }

    .owner-tag-link:hover .owner-tag {
      background: rgba(224, 48, 48, 0.3);
      border-color: rgba(224, 48, 48, 0.6);
    }

    .owner-tag.tag-purple {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      color: #b4a5ff;
    }

    .owner-tag-link:hover .owner-tag.tag-purple {
      background: rgba(139, 92, 246, 0.35);
      border-color: rgba(139, 92, 246, 0.65);
    }

    .owner-tag.tag-red {
      background: rgba(224, 48, 48, 0.2);
      border-color: rgba(224, 48, 48, 0.4);
      color: #ff6b6b;
    }

    .expand {
      width: 100%;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 768px) {
      .expand {
        transition: max-height 0.5s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.3s ease;
      }

      .card:hover .expand {
        max-height: 600px;
      }

      .ver-mais-btn,
      .ver-menos-btn {
        padding: 8px 0 !important;
        font-size: 0.5rem !important;
      }

      .activity-block {
        padding: 10px 9px !important;
      }
    }

    .card:hover .expand {
      max-height: 500px;
      opacity: 1;
      overflow: visible;
    }

    .acc-age {
      font-size: clamp(0.5rem, 0.9vw, 0.58rem);
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 2px;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .activity-block {
      width: 100%;
      padding: 7px 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: clamp(0.52rem, 0.9vw, 0.6rem);
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.35;
      text-align: left;
    }

    .activity-block .act-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.5rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 3px;
    }

    .activity-block .act-name {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
      word-break: break-word;
    }

    .social-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 7px 0;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.25s var(--ease-spring);
      will-change: transform;
      cursor: pointer;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      transform: scale(1.03) translateY(-2px);
    }

    .social-btn:active {
      transform: scale(0.97);
      transition: transform 0.08s;
    }

    .social-btn img {
      width: 13px;
      height: 13px;
      flex-shrink: 0;
    }

    .social-btn span {
      font-family: 'Syne', sans-serif;
      font-size: clamp(0.48rem, 0.9vw, 0.55rem);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .skel {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    .vc-wrap {
      position: relative;
      z-index: 10;
      margin-top: clamp(16px, 3vw, 24px);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 6px 16px;
      transition: all 0.3s;
    }

    .vc-wrap:hover {
      border-color: rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .vc-eye {
      width: 14px;
      height: 14px;
      opacity: 0.5;
    }

    .odometer {
      display: inline-flex;
      align-items: center;
      font-family: 'Syne', monospace;
      font-weight: 700;
      font-size: clamp(0.7rem, 1.4vw, 0.85rem);
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.85);
    }

    .odometer-digit {
      display: inline-block;
      overflow: hidden;
      height: 1.2em;
      width: 0.85em;
      text-align: center;
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
    }

    .odometer-digit,
    .odometer-roll span,
    .odometer-comma {
      color: rgba(255, 255, 255, 0.9) !important;
    }

    .odometer-roll {
      display: flex;
      flex-direction: column;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      will-change: transform;
    }

    .odometer-roll span {
      font-family: 'Syne', monospace;
      font-weight: 700;
      height: 1.2em;
      line-height: 1.2em;
      display: block;
    }

    .odometer-comma {
      margin: 0 1px;
      font-family: 'Syne', monospace;
    }

    #odometer-container {
      display: inline-flex;
      align-items: center;
      gap: 0;
      padding: 0;
      min-width: auto;
    }

    .meta {
      position: relative;
      z-index: 10;
      margin-top: clamp(12px, 2.5vw, 18px);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(0.55rem, 1vw, 0.65rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .meta-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.3s;
    }

    .meta-dot.pulse-active {
      background: var(--online);
      box-shadow: 0 0 12px rgba(35, 165, 89, 0.6);
      animation: metaPulse 2s ease-in-out infinite;
    }

    @keyframes metaPulse {

      0%,
      100% {
        box-shadow: 0 0 8px rgba(35, 165, 89, 0.5);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 18px rgba(35, 165, 89, 0.9);
        transform: scale(1.15);
      }
    }

    [data-sonner-toaster] {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 356px;
      max-width: calc(100vw - 48px);
      z-index: 999999999;
      pointer-events: none;
      font-family: 'Syne', sans-serif;
    }

    .toast-list {
      position: relative;
      pointer-events: auto;
    }

    .toast-item {
      width: 100%;
      background: rgba(20, 20, 24, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px;
      padding: 12px 24px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transition: opacity 400ms cubic-bezier(0.23, 1, 0.32, 1),
        transform 400ms cubic-bezier(0.23, 1, 0.32, 1);
      cursor: default;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      position: absolute;
      right: 0;
    }

    .toast-item[data-visible="true"] {
      opacity: 1;
    }

    .toast-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 60%;
      border-radius: 3px;
      background: var(--online);
    }

    .toast-item.toast-error::before {
      background: var(--dnd);
    }

    .toast-item.removing {
      transition: transform 300ms ease-in, opacity 300ms ease-in;
      transform: translateY(-10px) scale(0.9) !important;
      opacity: 0 !important;
    }

    @media (max-width: 600px) {
      [data-sonner-toaster] {
        left: 16px;
        right: 16px;
        width: auto;
        bottom: 16px;
      }

      .toast-item {
        white-space: normal;
        font-size: 0.65rem;
        padding: 10px 18px;
        width: 100%;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .more-activity-item {

    }

    @media (max-width: 640px) {

      }

      }
    }
  </style>
</head>

      { id: '964439680160522250', name: 'gugu', tag: 'feiqqer.', roblox: 'https://www.roblox.com/pt/users/8239645037/profile', spotify: 'https://open.spotify.com/user/31vgem7t4si37tjh5bfnd2xbzhma?si=bbf77fd6102a4943', github: 'https://github.com/fakersl', customTag: { label: 'thebestdev', color: 'tag-purple' }, center: true, tagColor: 'purple' },

    (function initToastSystem() {
      const toastContainer = document.createElement('div');
      toastContainer.setAttribute('data-sonner-toaster', '');
      toastContainer.innerHTML = '<div class="toast-list" id="toast-list"></div>';
      document.body.appendChild(toastContainer);

      const toastList = document.getElementById('toast-list');
      let toastCounter = 0;

      window.showToast = function (message, type = 'success') {
        const id = ++toastCounter;
        const toast = document.createElement('div');
        toast.className = `toast-item toast-${type}`;
        toast.textContent = message;
        toast.dataset.id = id;
        toast.dataset.visible = 'false';
        toastList.appendChild(toast);

        requestAnimationFrame(() => {
          updateToastPositions();
          requestAnimationFrame(() => {
            toast.dataset.visible = 'true';
          });
        });

        const autoRemove = setTimeout(() => removeToast(toast), 3000);

        toast.addEventListener('mouseenter', () => clearTimeout(autoRemove));
        toast.addEventListener('mouseleave', () => {
          const newTimeout = setTimeout(() => removeToast(toast), 1500);
          toast._removeTimeout = newTimeout;
        });

        toast.addEventListener('click', () => removeToast(toast));
      };

      function removeToast(toast) {
        if (toast.classList.contains('removing')) return;
        if (toast._removeTimeout) clearTimeout(toast._removeTimeout);
        toast.classList.add('removing');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.remove();
            updateToastPositions();
          }
        }, 300);
      }

      function updateToastPositions() {
        const toasts = Array.from(toastList.children).filter(t => !t.classList.contains('removing'));
        const total = toasts.length;
        const maxVisible = 3;

        toasts.forEach((toast, index) => {
          const isFront = index === total - 1;
          const position = total - 1 - index;

          const bottomOffset = -(position * 10);
          const scale = Math.max(0.85, 1 - position * 0.06);
          const opacity = Math.max(0, 1 - position * 0.35);

          toast.style.bottom = `${bottomOffset}px`;
          toast.style.transform = `scale(${scale})`;
          toast.style.opacity = opacity;
          toast.style.zIndex = 100 - position;
          toast.style.pointerEvents = position >= maxVisible ? 'none' : 'auto';
          toast.dataset.front = isFront;
        });
      }
    })();

    async function getServerIcon() {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        try {
          const { iconUrl, timestamp } = JSON.parse(cached);
          if (Date.now() - timestamp < CACHE_DURATION) return { iconUrl, isCached: true };
        } catch (e) { }
      }
      try {
        const response = await fetch(`https://discord.com/api/v9/invites/${SERVER_INVITE}`);
        const data = await response.json();
        if (data.guild && data.guild.icon) {
          const gifUrl = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.gif?size=32`;
          const webpUrl = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.webp?size=32`;
          const imgTest = new Image();
          const iconUrl = await new Promise((resolve) => {
            imgTest.onload = () => resolve(gifUrl);
            imgTest.onerror = () => resolve(webpUrl);
            imgTest.src = gifUrl;
          });
          localStorage.setItem(CACHE_KEY, JSON.stringify({ iconUrl, timestamp: Date.now(), guildId: data.guild.id }));
          return { iconUrl, isCached: false };
        }
      } catch (error) { }
      return { iconUrl: 'https://cdn.discordapp.com/icons/1254375845933285448/43a9c6d37f5c9a1012f70151ef1a5a2f.webp?size=32', isCached: false };
    }

    function getAge(id) {
      try {
        const t = Number((BigInt(id) >> 22n) + 1420070400000n);
        const d = new Date(t), n = new Date();
        if (t > n.getTime()) return 'nova';
        let y = n.getFullYear() - d.getFullYear();
        let m = n.getMonth() - d.getMonth();
        if (m < 0) { y--; m += 12; }
        return y > 0 ? `${y}a ${m}m` : `${Math.floor((n - t) / 86400000)}d`;
      } catch { return '?'; }
    }

    function avatarUrl(id, hash) {
      if (!hash) return `https://cdn.discordapp.com/embed/avatars/${Number(BigInt(id) >> 22n) % 6}.png`;
      const ext = hash.startsWith('a_') ? 'gif' : 'webp';
      return `https://cdn.discordapp.com/avatars/${id}/${hash}.${ext}?size=256`;
    }

    function getAllActivities(activities = []) {
      if (!activities.length) return [];
      const result = [];
      for (const act of activities) {
        if (act.type === 4) continue;
        if (act.type === 2) {
          result.push({ label: '🎧 ouvindo', name: act.details || act.name, sub: act.state });
        } else if (act.type === 0) {
          let icon = '';
          if (act.name === 'Visual Studio Code') icon = '';
          result.push({ label: `${icon} ${act.name === 'Visual Studio Code' ? 'codando' : 'jogando'}`, name: act.name, sub: act.details });
        } else {
          result.push({ label: '📌 atividade', name: act.name, sub: act.details });
        }
      }
      return result;
    }

    function getActivity(activities = []) {
      if (!activities.length) return null;
      const spot = activities.find(a => a.type === 2);
      if (spot) return { label: 'ouvindo', name: spot.details || spot.name };
      const game = activities.find(a => a.type === 0);
      if (game) return { label: 'jogando', name: game.name };
      const custom = activities.find(a => a.type === 4 && a.state);
      if (custom) return { label: 'status', name: custom.state };
      return null;
    }

      const nmCopy = discordTag ? `class="nm copyable" data-copy="${discordTag}" title="copiar @${discordTag}"` : `class="nm"`;
      const tagHTML = user.customTag ? `<a class="owner-tag-link" href="https://discord.gg/cnl" target="_blank"><div class="owner-tag ${user.customTag.color}">${user.customTag.label}</div></a>` : '';

      return `<div class="glare"></div><div class="ci"><div class="aw"><div class="av-wrapper" data-glow="${tagColor}"><img class="av" src="${av}" alt="${user.name}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'"></div><div class="sd ${status}"></div></div><div ${nmCopy}>${user.name}</div>${tagDisplay}${tagHTML}<div class="expand" id="expand-${user.id}">${actHTML}${moreBtnHTML}${moreActivitiesHTML}<div class="acc-age">conta criada há ${age}</div><div class="social-row">${buildSocials(user)}</div></div></div>`;
    }

    function toggleMoreActivities(userId, btn) {
      const moreDiv = document.getElementById(`more-activities-${userId}`);
      if (!moreDiv) return;

      if (moreDiv.style.display === 'none' || moreDiv.style.display === '') {
        moreDiv.style.display = 'block';
        if (btn) {
          btn.style.opacity = '0';
          btn.style.transform = 'translateY(-5px)';
          setTimeout(() => { btn.style.display = 'none'; }, 200);
        }
      }
    }

    function toggleLessActivities(userId) {
      const moreDiv = document.getElementById(`more-activities-${userId}`);
      const verMaisBtn = document.querySelector(`.ver-mais-btn[data-user="${userId}"]`);

      if (moreDiv && verMaisBtn) {
        moreDiv.style.display = 'none';
        verMaisBtn.style.display = 'block';
        verMaisBtn.style.opacity = '1';
        verMaisBtn.style.transform = 'translateY(0)';
        const allActs = userAllActivities[userId] || [];
        verMaisBtn.innerHTML = `➕ ver mais (${allActs.length - 1})`;
        verMaisBtn.style.background = 'rgba(255,255,255,0.08)';
        verMaisBtn.style.borderColor = 'rgba(255,255,255,0.1)';
      }
    }

    function applyTilt(card) {
      let vx = 0, vy = 0;
      let curX = 0, curY = 0;
      let tarX = 0, tarY = 0;
      let isHovered = false;

      const stiffness = 0.08;
      const damping = 0.75;
      const maxRotation = 16;

      function spring() {
        const fx = (tarX - curX) * stiffness;
        const fy = (tarY - curY) * stiffness;

        vx = (vx + fx) * damping;
        vy = (vy + fy) * damping;

        curX += vx;
        curY += vy;

        card.style.transform = `perspective(900px) rotateX(${-curY * maxRotation}deg) rotateY(${curX * maxRotation}deg)`;

        const g = card.querySelector('.glare');
        if (g && isHovered) {
          const gx = (curX + 1) * 50;
          const gy = (curY + 1) * 50;
          g.style.opacity = '1';
          g.style.background = `radial-gradient(circle at ${gx}% ${gy}%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.02) 40%, transparent 70%)`;
        }

        const isMoving = Math.abs(vx) > 0.0001 || Math.abs(vy) > 0.0001;
        if (isMoving || isHovered) {
          requestAnimationFrame(spring);
        }
      }

      card.addEventListener('mouseenter', () => {
        isHovered = true;
        spring();
      });

      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        tarX = ((e.clientX - r.left) / r.width - 0.5) * 2;
        tarY = ((e.clientY - r.top) / r.height - 0.5) * 2;
      });

      card.addEventListener('mouseleave', () => {
        isHovered = false;
        tarX = 0;
        tarY = 0;
        const g = card.querySelector('.glare');
        if (g) {
          g.style.opacity = '0';
          g.style.background = 'radial-gradient(circle at 50% 50%, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.02) 40%, transparent 70%)';
        }
        spring();
      });
    }

    async function refresh() {
      const results = await Promise.all(USERS.map(u => fetchLanyard(u.id)));
      results.forEach((data, i) => {
        const u = USERS[i], el = cardEls[u.id];
        const newHTML = buildCardHTML(u, data);
        if (el.dataset.lastRender !== newHTML) {
          el.dataset.lastRender = newHTML;
          el.innerHTML = newHTML;
          el.setAttribute('data-tag-color', u.tagColor || 'purple');
        }
      });

      const online = results.filter(d => d?.discord_status === 'online').length;
      const idle = results.filter(d => d?.discord_status === 'idle').length;
      const active = online + idle;
      const dot = document.getElementById('meta-dot');
      const txt = document.getElementById('meta-txt');
      if (active > 0) { dot.classList.add('pulse-active'); txt.textContent = `${active} de ${USERS.length} online`; }
      else { dot.classList.remove('pulse-active'); txt.textContent = 'todos offline'; }
    }

    async function init() {
      const stage = document.getElementById('stage');
      USERS.forEach(u => {
        const el = document.createElement('div');
        el.className = u.center ? 'card card-center' : 'card';
        el.id = `card-${u.id}`;
        el.setAttribute('data-tag-color', u.tagColor || 'purple');
        el.innerHTML = `<div class="ci"><div class="skel skel-av"></div><div class="skel skel-nm"></div><div class="skel skel-un"></div><div class="skel skel-tag"></div><div class="skel skel-st"></div></div>`;
        stage.appendChild(el);
        cardEls[u.id] = el;
        applyTilt(el);
      });
      await refresh();

      setTimeout(() => {
        if (window.startOdometerAnimation) {
          window.startOdometerAnimation();
        }
      }, 800);

      setInterval(refresh, REFRESH_MS);
    }
    init();
    document.addEventListener('click', e => {
      const verMaisBtn = e.target.closest('.ver-mais-btn');
      if (verMaisBtn) {
        e.stopPropagation();
        toggleMoreActivities(verMaisBtn.dataset.user, verMaisBtn);
        return;
      }

      const verMenosBtn = e.target.closest('.ver-menos-btn');
      if (verMenosBtn) {
        e.stopPropagation();
        toggleLessActivities(verMenosBtn.dataset.user);
        return;
      }

      const el = e.target.closest('.copyable');
      if (!el) return;
      e.stopPropagation();
      const val = el.dataset.copy;
      if (!val) return;
      navigator.clipboard.writeText(`@${val}`).then(() => {
        showToast(`@${val} copiado!`, 'success');
        el.style.color = '#23a559';
        setTimeout(() => el.style.color = '', 200);
      }).catch(() => showToast('erro ao copiar', 'error'));
    });

    (function () {
      const STORAGE_KEY = 'gon_visualizacoes';
      const START_VALUE = 1417;
      const COUNTER_KEY = 'gon_central_visits';
      const API_URL = `https://countapi.mileshilliard.com/api/v1/hit/${COUNTER_KEY}`;

      let finalValue = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      if (isNaN(finalValue) || finalValue < START_VALUE) {
        finalValue = START_VALUE;
      }

      async function fetchAndIncrement() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error('API error');
          const data = await response.json();
          if (data && data.value) {
            finalValue = START_VALUE + parseInt(data.value, 10);
            localStorage.setItem(STORAGE_KEY, finalValue);
            return true;
          }
          return false;
        } catch (error) {
          console.log('CountAPI offline, usando cache local');
          return false;
        }
      }

      function incrementLocal() {
        if (!sessionStorage.getItem('gon_view_counted')) {
          finalValue++;
          localStorage.setItem(STORAGE_KEY, finalValue);
          sessionStorage.setItem('gon_view_counted', '1');
        }
      }

      function formatNumber(num) {
        return num.toLocaleString('en-US');
      }

      function createDigitElement(digit) {
        const span = document.createElement('span');
        span.className = 'odometer-digit';
        span.style.cssText = 'display:inline-block;overflow:hidden;height:1.2em;width:0.65em;text-align:center;vertical-align:middle';
        const roll = document.createElement('div');
        roll.className = 'odometer-roll';
        roll.style.cssText = 'display:flex;flex-direction:column;transition:transform 0.5s cubic-bezier(0.23,1,0.32,1)';
        for (let i = 0; i <= 9; i++) {
          const num = document.createElement('span');
          num.textContent = i;
          num.style.cssText = 'height:1.2em;line-height:1.2em;display:block';
          roll.appendChild(num);
        }
        roll.style.transform = `translateY(-${digit * 10}%)`;
        span.appendChild(roll);
        return span;
      }

      function createCommaElement() {
        const span = document.createElement('span');
        span.className = 'odometer-comma';
        span.textContent = ',';
        span.style.margin = '0 1px';
        return span;
      }

      function renderNumber(value) {
        const container = document.getElementById('odometer-container');
        if (!container) return;
        container.innerHTML = '';
        const str = formatNumber(value);
        for (let ch of str) {
          if (ch === ',') {
            container.appendChild(createCommaElement());
          } else {
            container.appendChild(createDigitElement(parseInt(ch, 10)));
          }
        }
      }

      function animateToValue(targetValue, duration = 1500) {
        const container = document.getElementById('odometer-container');
        if (!container) return;
        const startTime = performance.now();
        const finalStr = formatNumber(targetValue);
        const digitCount = finalStr.replace(/,/g, '').length;

        function update(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const currentValue = Math.round(eased * targetValue);
          const currentStr = formatNumber(currentValue);
          const currentClean = currentStr.replace(/,/g, '');
          const padded = currentClean.padStart(digitCount, '0');
          let displayStr = '';
          let digitIndex = 0;
          for (let ch of finalStr) {
            if (ch === ',') {
              displayStr += ',';
            } else {
              displayStr += padded[digitIndex] || '0';
              digitIndex++;
            }
          }
          const children = Array.from(container.children);
          let childIndex = 0;
          for (let ch of displayStr) {
            if (ch === ',') { childIndex++; continue; }
            if (childIndex < children.length) {
              const roll = children[childIndex].querySelector('.odometer-roll');
              if (roll) {
                roll.style.transform = `translateY(-${parseInt(ch, 10) * 10}%)`;
              }
            }
            childIndex++;
          }
          if (progress < 1) {
            requestAnimationFrame(update);
          }
        }
        requestAnimationFrame(update);
      }

      async function initCounter() {
        const apiSuccess = await fetchAndIncrement();
        if (!apiSuccess) {
          incrementLocal();
        }
        renderNumber(finalValue);

        window.startOdometerAnimation = function () {
          animateToValue(finalValue, 1500);
        };
      }

      initCounter();
    })();

    const audio = document.getElementById('bg-audio');
    const pp = document.getElementById('pp');
    const vl = document.getElementById('vl');
    const seek = document.getElementById('seek');
    let userPaused = false, fadeIv = null;
    let isSeeking = false; // impede conflito ao arrastar a barra

    const savedVol = Math.min(parseFloat(localStorage.getItem('site_vol') ?? '0.2'), 0.2);
    audio.volume = savedVol;
    vl.value = savedVol;

    function updateUI() {
      pp.textContent = audio.paused ? '▶' : '⏸';
    }

    // Atualiza a barra de progresso conforme a música toca
    audio.addEventListener('timeupdate', () => {
      if (!isSeeking && audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        seek.value = percent;
      }
    });

    // Permite arrastar a barra para mudar o tempo
    seek.addEventListener('input', () => {
      if (audio.duration) {
        isSeeking = true;
        audio.currentTime = (seek.value / 100) * audio.duration;
      }
    });

    seek.addEventListener('change', () => {
      isSeeking = false; // libera a atualização automática
    });

    // Ajusta o max da barra quando a música carrega
    audio.addEventListener('loadedmetadata', () => {
      seek.max = 100;
    });

    function fadeIn(target, duration = 1000) {
      clearInterval(fadeIv);
      audio.volume = 0;
      const step = Math.max(target, 0.01) / (duration / 30);
      fadeIv = setInterval(() => {
        if (audio.volume + step >= target) {
          audio.volume = target;
          clearInterval(fadeIv);
        } else {
          audio.volume += step;
        }
      }, 30);
    }

    function tryPlay() {
      if (userPaused) return;
      audio.load();
      audio.play().then(() => {
        fadeIn(parseFloat(vl.value) || 0.2);
        updateUI();
      }).catch(() => {
        document.addEventListener('click', function resume() {
          if (!userPaused) audio.play().catch(() => { });
          document.removeEventListener('click', resume);
        });
      });
    }

    audio.addEventListener('ended', () => {
      if (!userPaused) tryPlay();
    });

    pp.addEventListener('click', e => {
      e.stopPropagation();
      if (audio.paused) {
        userPaused = false;
        audio.play().then(() => {
          fadeIn(parseFloat(vl.value) || 0.2);
          updateUI();
        }).catch(() => { });
      } else {
        userPaused = true;
        audio.pause();
        updateUI();
      }
    });

    vl.addEventListener('input', e => {
      const vol = Math.min(parseFloat(e.target.value), 0.2);
      audio.volume = vol;
      localStorage.setItem('site_vol', vol);
    });

    window.addEventListener('load', tryPlay);
  </script>
